<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>O Senhor do Violino</title>
  <style>
    :root { --hall:#100e0c; --ink:#f4ecdf; --gold:#c4a574; --seal:#c42121; --seal-deep:#6e1010; }
    * { box-sizing: border-box; }
    html, body { height:100%; margin:0; background:var(--hall); color:var(--ink); font-family: Georgia, serif; }
    .hall {
      min-height:100%; display:flex; align-items:center; justify-content:center; padding:1.5rem 1rem 2rem;
      background: radial-gradient(ellipse 70% 50% at 50% 18%, rgb(196 165 116 / .14), transparent 60%), var(--hall);
    }
    .stage { width:min(92vw, 26rem); text-align:center; }
    .kicker { margin:0 0 1.4rem; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); font-size:.95rem; }
    .seal {
      appearance:none; border:0; border-radius:999px; padding:.95rem 2.4rem; min-height:3rem; cursor:pointer;
      font: 500 1rem system-ui, sans-serif; letter-spacing:.12em; color:var(--ink);
      background: radial-gradient(circle at 30% 20%, #e23b3b, var(--seal) 46%, var(--seal-deep));
    }
    .seal.is-gone { display:none; }
    .reveal { display:none; }
    .reveal.is-on { display:block; }
    video {
      display:block; width:100%; max-height:min(70vh, 36rem); border-radius:.7rem; background:#100e0c;
      box-shadow: 0 0 0 1px rgb(196 165 116 / .22), 0 28px 70px rgb(0 0 0 / .55);
    }
    .caption { margin:.85rem 0 0; font-style:italic; font-size:1.25rem; color:var(--gold); }
    .row { display:none; gap:.55rem; justify-content:center; margin-top:1rem; }
    .row.is-on { display:flex; }
    .ghost {
      min-height:2.75rem; padding:.4rem .95rem; border-radius:999px; cursor:pointer;
      border:1px solid rgb(196 165 116 / .4); background:transparent; color:var(--gold);
      font: .8rem system-ui, sans-serif; letter-spacing:.08em;
    }
  </style>
</head>
<body>
  <main class="hall">
    <div class="stage">
      <p class="kicker" id="kicker">uma nota apenas</p>
      <button class="seal" id="seal" type="button">carregar</button>
      <div class="reveal" id="reveal">
        <video id="film" playsinline loop preload="auto" src="violino.mp4"></video>
        <p class="caption">um senhor a tocar violino</p>
      </div>
      <div class="row" id="row">
        <button class="ghost" id="toggle" type="button">pausar</button>
        <button class="ghost" id="reset" type="button">voltar</button>
      </div>
    </div>
  </main>
  <script>
    const seal = document.getElementById("seal");
    const reveal = document.getElementById("reveal");
    const row = document.getElementById("row");
    const kicker = document.getElementById("kicker");
    const film = document.getElementById("film");
    const toggle = document.getElementById("toggle");

    seal.addEventListener("click", () => {
      seal.classList.add("is-gone");
      reveal.classList.add("is-on");
      row.classList.add("is-on");
      kicker.textContent = "adagio";
      toggle.textContent = "pausar";
      film.muted = false;
      film.currentTime = 0;
      film.play();
    });

    toggle.addEventListener("click", () => {
      if (film.paused) {
        film.play();
        toggle.textContent = "pausar";
      } else {
        film.pause();
        toggle.textContent = "tocar";
      }
    });

    document.getElementById("reset").addEventListener("click", () => {
      film.pause();
      film.currentTime = 0;
      seal.classList.remove("is-gone");
      reveal.classList.remove("is-on");
      row.classList.remove("is-on");
      kicker.textContent = "uma nota apenas";
    });
  </script>
</body>
</html>
